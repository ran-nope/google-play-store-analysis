[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-play-store-analysis"
version = "0.1.0"
description = "Reproducible descriptive analysis of historical Play Store records"
requires-python = ">=3.12"
dependencies = ["pandas==3.1.1", "numpy==2.5.4", "scikit-learn==1.9.1"]

[project.scripts]
play-store-analysis = "pipeline:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["pipeline"]
